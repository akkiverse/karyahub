<script>

/* =====================================================================

const params = new URLSearchParams(location.search);
const EMBED = params.has('embed');
const TODAY = '2026-11-01';

/* ---------- Icons (same Lucide-style set as src/ui/icons.js, plus new ones) ---------- */
const P = {

function icon(name, size = 20) {
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${P[name] || ''}</svg>`;
}
const LOGO = '<svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 8v16M9 16l9-8M12.5 13l7.5 11" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- Formatting (India: ₹ in lakh grouping, dd-mm-yyyy) ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const INR = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 2 });
const rupees = (p) => (p == null ? '—' : INR.format(p / 100));
const r3 = (n) => Math.round(n * 1000) / 1000;
const fq = (q) => r3(q).toLocaleString('en-IN', { maximumFractionDigits: 3 });
const UNITS = { nos: 'nos', kg: 'kg', metre: 'm', litre: 'litre', set: 'set', roll: 'roll' };
const UNIT_NAMES = { nos: 'nos (pieces)', kg: 'kg', metre: 'metre (m)', litre: 'litre', set: 'set', roll: 'roll' };
const UNIT_ALIASES = { m: 'metre', mtr: 'metre', meter: 'metre', metres: 'metre', kgs: 'kg', l: 'litre', ltr: 'litre', pcs: 'nos', pc: 'nos', no: 'nos' };
const WHOLE = new Set(['nos', 'set', 'roll']);
const GST = [0, 5, 18, 40];
const qtyU = (q, u) => `${fq(q)} ${UNITS[u]}`;
const signed = (q, u) => `${q > 0 ? '+' : '−'}${qtyU(Math.abs(q), u)}`;
const dmy = (iso) => { const [y, m, d] = iso.split('-'); return `${d}-${m}-${y}`; };
const isoFromDmy = (s) => { const m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(s.trim()); if (!m) return null; const iso = `${m[3]}-${m[2]}-${m[1]}`; const d = new Date(iso + 'T00:00:00Z'); return Number.isNaN(d.getTime()) || d.toISOString().slice(0, 10) !== iso ? null : iso; };
const norm = (s) => String(s).toLowerCase().replace(/µ/g, 'u').replace(/[\s.\-_/()]+/g, '');
const words = (s) => String(s).toLowerCase().replace(/µ/g, 'u').split(/[\s,]+/).map(norm).filter(Boolean);
function matches(item, q) { const hay = norm(item.name) + ' ' + norm(item.code || ''); return words(q).every((w) => hay.includes(w)); }

/* ---------- Sample data for "CoolCare AC Services" (mockup only) ---------- */
const PEOPLE = { owner: { name: 'Akash Mehta', role: 'owner', label: 'Owner (admin)', initials: 'AM' }, technician: { name: 'Santosh Pawar', role: 'technician', label: 'Technician', initials: 'SP' } };
const I = (id, code, name, unit, qty, low, sale, cost, hsn, gst = 18, stopped = false) => ({ id, code, name, unit, qty, low, sale: sale * 100, cost: cost == null ? null : cost * 100, hsn, gst, stopped });

  role: params.get('role') === 'technician' ? 'technician' : 'owner',
  online: params.get('signal') !== 'off',
  theme: ['light', 'dark'].includes(params.get('theme')) ? params.get('theme') : 'system',

  form: null,
  csv: null, csvResult: null,
  showLines: false,

    I('cu14', 'CU-14', 'Copper pipe 1/4 in', 'metre', 38, 20, 260, 180, '7411'),

    I('drn16', 'DRN-16', 'Drain pipe 16 mm', 'metre', 45, 10, 40, 22, '3917'),

// History for the items shown in detail; every other item gets one opening stock move.

/* ---------- Stock rules (the server's job in the real app; shown here on the device) ---------- */
function markOf(it) {
  if (it.qty < 0) return { k: 'short', t: `Short by ${qtyU(-it.qty, it.unit)}` };
  if (it.qty === 0) return { k: 'out', t: 'Out' };
  if (it.low != null && it.qty <= it.low) return { k: 'low', t: 'Low' };
  return null;
}
const markHtml = (it) => { const m = markOf(it); return m ? `<span class="mark mark-${m.k}">${m.k === 'low' ? icon('alert', 12) : ''}${esc(m.t)}</span>` : ''; };
const qtyHtml = (it) => { const m = markOf(it); return `<span class="qty ${m ? 'is-' + m.k : ''}">${esc(qtyU(it.qty, it.unit))}</span>`; };
function post(itemId, kind, qty, extra = {}) {
  const it = itemById(itemId);
  it.qty = r3(it.qty + qty);
  mv(itemId, TODAY, kind, qty, me().name, extra);
  queueChange();
}
function queueChange(n = 1) {
  S.queue += n;
  if (S.online) flushSoon();
  paintChip();
}
function flushSoon() {
  if (!S.queue) return;
  S.sending = true; paintChip();
  clearTimeout(flushSoon.t);
  flushSoon.t = setTimeout(() => { S.queue = 0; S.sending = false; paintChip(); }, 1100);
}

/* ---------- Routing ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '') || 'stock';
  const [a, b, c, d] = h.split('/');
  if (a === 'stock' && !b) return { name: 'list', tab: 'stock' };
  if (a === 'stock' && b === 'new') return { name: 'item-form', tab: 'stock' };
  if (a === 'stock' && b === 'import') return { name: 'import', tab: 'stock' };
  if (a === 'stock' && b === 'item' && c && d === 'edit') return { name: 'item-form', id: c, tab: 'stock' };
  if (a === 'stock' && b === 'item' && c) return { name: 'item', id: c, tab: 'stock' };
  if (a === 'jobs' && b) return { name: 'job', id: b, tab: 'jobs' };
  return { name: 'other', tab: a };
}

    all: live.length,

function sheetHtml() {
  const sh = S.sheet;
  if (!sh) return '';

  if (sh.type === 'in') {
    title = `Stock in: ${it.name}`;

      <div class="form-grid">${qtyField('Quantity received')}

  } else if (sh.type === 'out') {
    const reasons = [['supplier', 'Returned to supplier'], ['lost', 'Damaged or lost'], ['other', 'Used without a job']];
    title = `Stock out: ${it.name}`;
    body = `<p class="muted">In stock now: ${qtyHtml(it)}</p>
      <p class="warn-note">${icon('wrench', 16)}<span>Taking a part for a job? Do it on the job's screen, so it goes on that job's invoice.</span></p>
      ${qtyField('Quantity going out')}
      <fieldset class="reason-list"><legend>Reason</legend>${reasons.map(([k, l]) => `<label class="radio"><input type="radio" name="reason" value="${k}" ${v.reason === k ? 'checked' : ''}> ${l}</label>`).join('')}${err('reason')}</fieldset>

  } else if (sh.type === 'count') {
    title = `Count: ${it.name}`;

    const diff = counted.ok ? r3(counted.value - it.qty) : null;
    body = `<p class="muted">The records say ${qtyHtml(it)}. Count what is on the shelf and type it here.</p>
      ${qtyField('Counted on the shelf')}

  } else if (sh.type === 'pick') {

function validateItem(v, editingId) {

function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }

}
function checkCsv(text, size) {
  if (size > 1024 * 1024) return { refused: 'This file is bigger than 1 MB. Split it into smaller files.' };
  const rows = parseCsv(text.replace(/^﻿/, ''));
  if (!rows.length) return { refused: 'This file is empty. Download the template and fill in one row per item.' };
  const head = rows[0].map((h) => h.trim().toLowerCase());
  if (!head.includes('name')) return { refused: 'This file has no "name" column. Use the template: its first row names the columns.' };
  const data = rows.slice(1);
  if (!data.length) return { refused: 'This file has only the column names. Add one row per item below them.' };
  if (data.length > 500) return { refused: `This file has ${data.length} rows; up to 500 can be imported at once. Split it into smaller files.` };
  const seen = new Map();
  const out = data.map((cells, idx) => {
    const n = idx + 2; // spreadsheet row number: the column names are row 1
    const r = Object.fromEntries(CSV_COLS.map((c) => [c, String(cells[head.indexOf(c)] ?? '').trim()]));
    const problems = [], notes = [];
    if (r.name.length < 2) problems.push(r.name ? 'name is shorter than 2 letters' : 'name is empty');
    const unit = UNITS[r.unit.toLowerCase()] ? r.unit.toLowerCase() : UNIT_ALIASES[r.unit.toLowerCase()];
    if (!unit) problems.push(`unit "${r.unit}" isn't one of nos, kg, metre, litre, set, roll`);
    const sale = parseMoney(r.sale_price); if (!sale.ok || sale.value == null) problems.push(`sale price "${r.sale_price}" isn't a number`);
    const cost = parseMoney(r.cost_price); if (!cost.ok) problems.push(`cost price "${r.cost_price}" isn't a number`);
    if (r.hsn && !/^(\d{4}|\d{6}|\d{8})$/.test(r.hsn)) problems.push(`HSN "${r.hsn}" must have 4, 6 or 8 digits`);
    const gst = r.gst_rate === '' ? 18 : Number(r.gst_rate);
    if (!GST.includes(gst)) problems.push(`GST rate ${r.gst_rate} % isn't one of 0, 5, 18, 40`);
    if (r.low_stock_at && !/^\d+(\.\d{1,3})?$/.test(r.low_stock_at)) problems.push('low_stock_at isn\'t a number');
    const op = r.opening_stock ? parseQty(r.opening_stock, unit || 'kg') : { ok: true, value: 0 };
    if (!op.ok) problems.push(`opening stock: ${op.msg.toLowerCase().replace(/\.$/, '')}`);
    const key = r.code ? 'c:' + r.code.toLowerCase() : r.name ? 'n:' + r.name.toLowerCase() : null;
    if (key && seen.has(key)) problems.push(`${r.code ? 'code ' + r.code : 'this name'} is also in row ${seen.get(key)}`);
    else if (key) seen.set(key, n);
    const existing = S.items.find((i) => (r.code ? i.code && i.code.toLowerCase() === r.code.toLowerCase() : i.name.toLowerCase() === r.name.toLowerCase()));
    if (existing && op.ok && op.value) notes.push('opening stock ignored for an existing item: use Stock in');
    if (unit && r.unit.toLowerCase() !== unit) notes.push(`unit "${r.unit}" read as ${unit}`);
    const fields = problems.length ? null : { code: r.code || null, name: r.name, unit, sale: sale.value, cost: cost.value, hsn: r.hsn || null, gst, low: r.low_stock_at ? Number(r.low_stock_at) : null };
    let status = problems.length ? 'problem' : existing ? 'update' : 'new';
    if (status === 'update' && ['code', 'name', 'unit', 'sale', 'cost', 'hsn', 'gst', 'low'].every((k) => (existing[k] ?? null) === (fields[k] ?? null))) status = 'same';
    return { n, r, problems, notes, status, fields, existing, opening: op.ok ? op.value : 0 };
  });

}

function doImport() {
  const rows = S.csv.rows;
  let added = 0, updated = 0;
  for (const r of rows) {
    if (r.status === 'new') {
      const id = 'n' + (++seq);
      S.items.push({ id, qty: 0, stopped: false, ...r.fields });
      if (r.opening) { itemById(id).qty = r.opening; mv(id, TODAY, 'opening', r.opening, me().name, { note: 'From CSV import' }); }
      added++;
    } else if (r.status === 'update') { Object.assign(r.existing, r.fields); updated++; }
  }
  if (added + updated) queueChange(added + updated);
  const same = rows.filter((r) => r.status === 'same').length, bad = rows.filter((r) => r.status === 'problem').length;
  S.csvResult = `Imported from ${esc(S.csv.file)}: <strong>${added} new</strong>, <strong>${updated} updated</strong>${same ? `, ${same} already up to date` : ''}. ${bad ? `${bad} row${bad === 1 ? ' was' : 's were'} skipped: fix ${bad === 1 ? 'it' : 'them'} in the file and import it again.` : ''} <a href="#/stock">See the stock list</a>`;
  S.csv = { ...checkCsv(S.csv.text, 0), file: S.csv.file, text: S.csv.text }; // re-check: a second import now changes nothing
  render();
}

/* ---------- Screen: a job with parts used ---------- */
function noteParts() {

    const text = m ? m[1] : seg;
    const qty = m ? Number(m[2]) : 1;
    const item = S.items.find((i) => !i.stopped && words(text).every((w) => (norm(i.name) + ' ' + norm(i.code || '')).includes(w)));
    return { seg, text, qty, item };
  }).filter((s) => !S.job.dismissed.includes(s.seg) && !(s.item && S.job.used.some((u) => u.item === s.item.id && u.fromNote === s.seg)));
}
function takePart(itemId, qty, fromNote = null) {

  post(itemId, 'used', -qty, { job: S.job.id });
  S.job.used.push({ id: 'u' + (++seq), item: itemId, qty, fromNote });
  S.job.history.push({ at: dmy(TODAY) + ' ' + new Date().toTimeString().slice(0, 5), text: `${me().name} used ${qtyU(qty, it.unit)} ${it.name}` });
}
function jobScreen() {
  const j = S.job;
  const closed = j.state === 'CLOSED';
  const usable = can('use_parts') && !closed;
  const money = can('create_documents');
  const sugg = closed ? [] : noteParts();
  const used = j.used.map((u) => ({ ...u, it: itemById(u.item) }));
  const work = 60000;
  const lines = [{ d: 'Service visit: gas top-up, capacitor change, drain cleaning', q: 1, unit: '', rate: work }, ...used.map((u) => ({ d: `${u.it.name}`, q: u.qty, unit: UNITS[u.it.unit], rate: u.it.sale }))];
  const sub = lines.reduce((s, l) => s + Math.round(l.q * l.rate), 0);
  return `
  <section class="page" aria-labelledby="h-job">
    <a class="back" href="#/jobs/J-0042">${icon('arrowLeft', 18)} Jobs</a>
    <div class="page-head-row"><div class="page-head"><h1 id="h-job" tabindex="-1">${j.id} · ${esc(j.customer)}</h1><p class="pow-state"><span class="state-chip ${closed ? 'state-closed' : 'state-work_done'}">${closed ? 'Closed' : 'Work done, waiting for customer check'}</span></p></div></div>
    <p class="mock-note"><b>Mockup</b> ${closed ? 'This job is closed.' : 'This job is open.'} <button type="button" data-act="toggle-closed">${closed ? 'Open it again' : 'See it as a closed job'}</button></p>
    <dl class="detail">
      <div><dt>Customer</dt><dd>${esc(j.customer)}, ${esc(j.area)}</dd></div>
      <div><dt>Equipment</dt><dd>${esc(j.equipment)}</dd></div>
      <div><dt>Date</dt><dd>${dmy(j.date)}</dd></div>
      <div><dt>Work done</dt><dd>${esc(j.work)}</dd></div>
      <div><dt>Parts in the note</dt><dd>${esc(j.parts)}</dd></div>
    </dl>
    <div class="panel" aria-labelledby="h-parts">
      <div class="panel-head"><h2 class="panel-title" id="h-parts">${icon('box', 18)} Parts used</h2>${usable ? `<button type="button" class="btn btn-secondary btn-small" data-act="pick">${icon('plus', 18)} Take a part from stock</button>` : ''}</div>
      ${closed ? `<p class="notice">${icon('shield', 18)}<span>This job is closed, so its parts can't change.</span></p>` : ''}
      ${!can('use_parts') ? `<p class="muted">Your access doesn't include taking parts. Ask your business owner.</p>` : ''}
      ${usable && sugg.length ? `<div class="suggest-box"><h3>${icon('sparkle', 16)} From the note</h3><ul class="suggest-list">${sugg.map((s) => s.item
        ? `<li><span><strong>${esc(s.item.name)}</strong> <span class="muted small">“${esc(s.seg)}” · in stock ${esc(qtyU(s.item.qty, s.item.unit))}</span></span><span class="actions"><button type="button" class="btn btn-primary btn-small" data-take="${s.item.id}" data-qty="${s.qty}" data-seg="${esc(s.seg)}">Take ${esc(qtyU(s.qty, s.item.unit))}</button><button type="button" class="btn btn-ghost btn-small" data-dismiss="${esc(s.seg)}" aria-label="Not this one: ${esc(s.seg)}">${icon('x', 16)}</button></span></li>`
        : `<li><span class="muted">Not in your stock list: <strong>${esc(s.seg)}</strong></span>${can('manage_inventory') ? `<a class="btn btn-ghost btn-small" href="#/stock/new" data-prefill="${esc(s.text)}">${icon('plus', 16)} Add item</a>` : ''}</li>`).join('')}</ul><p class="muted small">Matched by name, without AI. Nothing is taken until you press Take.</p></div>` : ''}
      ${used.length ? `<ul class="parts-list">${used.map((u) => `<li><span><strong>${esc(u.it.name)}</strong> <span class="muted small">${esc(u.it.code || '')}</span></span><span class="actions" style="align-items:center"><span class="qty">${esc(qtyU(u.qty, u.it.unit))}</span>${money ? `<span class="muted small">${rupees(Math.round(u.qty * u.it.sale))}</span>` : ''}${usable ? `<button type="button" class="btn btn-ghost btn-small" data-remove="${u.id}">${icon('rotate', 16)} Remove</button>` : ''}</span></li>`).join('')}</ul>`
        : `<p class="muted">${closed ? 'No parts were taken from stock for this job.' : 'No parts taken from stock yet.'}</p>`}
      ${money && used.length ? `<div class="stack"><button type="button" class="link-btn" data-act="lines" aria-expanded="${S.showLines}">${S.showLines ? 'Hide' : 'Show'} what goes on the invoice</button>
        ${S.showLines ? `<ul class="lines-preview">${lines.map((l) => `<li><span>${esc(l.d)} <span class="muted small">${fq(l.q)}${l.unit ? ' ' + l.unit : ''} × ${rupees(l.rate)}</span></span><span>${rupees(Math.round(l.q * l.rate))}</span></li>`).join('')}<li class="lines-total"><span>Before GST</span><span>${rupees(sub)}</span></li></ul><p class="muted small">When you press Create invoice, these lines are filled in for you; you can still change any of them. GST is added as today.</p>` : ''}</div>` : ''}
    </div>
    <details class="pow"><summary class="section-title">Proof of work <span class="muted small">(unchanged in this change)</span></summary><p class="muted">Send code, Verify and Close, as today.</p></details>
    <details class="timeline" open><summary>Job history</summary><ol>${j.history.slice().reverse().map((h) => `<li><strong>${esc(h.text)}</strong><span class="muted small">${esc(h.at)}</span></li>`).join('')}</ol></details>
  </section>`;
}

/* ---------- Render and events ---------- */
function screen(r) {
  if (!can(NAV.find((n) => n[0] === r.tab)?.[5] || 'view_inventory')) return noAccess(r.tab === 'stock' ? 'Stock' : r.tab);
  switch (r.name) {
    case 'list': return listScreen();
    case 'item': return itemScreen(r.id);
    case 'item-form': return itemFormScreen(r.id);
    case 'import': return importScreen();
    case 'job': return r.id === S.job.id ? jobScreen() : `<section class="page placeholder"><a class="back" href="#/stock">${icon('arrowLeft', 18)} Stock</a><div class="empty">${icon('jobs', 28)}<h1>${esc(r.id)}</h1><p>Only job J-0042 is drawn in this mockup. In the app this link opens the job that used the part.</p><a class="btn btn-primary" href="#/jobs/J-0042">Open J-0042</a></div></section>`;
    default: return `<section class="page placeholder"><div class="empty">${icon('box', 28)}<h1>${esc((r.tab || 'This screen').replace(/^\w/, (c) => c.toUpperCase()))}</h1><p>This screen doesn't change in CR-0011. Use the Stock and Jobs screens, or the mockup bar.</p><a class="btn btn-primary" href="#/stock">Go to Stock</a></div></section>`;
  }
}
let lastRoute = '';
function render() {
  applyTheme();
  const r = route();
  const key = location.hash;
  const app = document.getElementById('app');
  app.innerHTML = shell(r, screen(r));
  if (key !== lastRoute) { lastRoute = key; const h = app.querySelector('h1[tabindex]'); if (h) h.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  if (S.sheet) S.sheet.shown = true; // slide in once, not on every redraw
  const auto = document.querySelector('.sheet [data-autofocus]');
  if (auto) auto.focus();
  const n = app.querySelector('[data-notice]');
  if (n) n.scrollIntoView({ block: 'nearest' });
  if (S.notice) S.notice.fresh = false; // shown once; the next screen change clears it
  paintBar();
}
function applyTheme() {
  const el = document.documentElement;
  if (S.theme === 'system') delete el.dataset.theme; else el.dataset.theme = S.theme;
}
window.addEventListener('hashchange', () => { if (!(S.notice && S.notice.fresh)) S.notice = null; S.sheet = null; if (route().name !== 'item-form') S.form = null; S.csvResult = route().name === 'import' ? S.csvResult : null; render(); });

const app = document.getElementById('app');
app.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, a, tr[data-href]');
  if (!t) return;
  if (t.matches('tr[data-href]') && !ev.target.closest('a')) { location.hash = t.dataset.href; return; }
  if (t.dataset.prefill != null) { S.prefill = t.dataset.prefill; S.form = null; }
  if (t.matches('a')) return;
  const r = route();
  if (t.dataset.filter) { S.filter = t.dataset.filter; refreshList(); return; }
  if (t.dataset.sheet) { S.sheet = { type: t.dataset.sheet, item: r.id, values: {}, errors: {} }; render(); return; }
  if (t.dataset.pick) { S.sheet = { type: 'pick', item: t.dataset.pick, values: {}, errors: {} }; render(); return; }
  if (t.dataset.take) {
    takePart(t.dataset.take, Number(t.dataset.qty), t.dataset.seg);
    const it = itemById(t.dataset.take);
    S.notice = { fresh: true, text: `Took ${qtyU(Number(t.dataset.qty), it.unit)} of ${it.name} for ${S.job.id}.${it.qty < 0 ? ` Only ${qtyU(Math.max(it.qty + Number(t.dataset.qty), 0), it.unit)} was in stock: it now shows as short until someone counts.` : ''}` };
    render(); return;
  }
  if (t.dataset.dismiss) { S.job.dismissed.push(t.dataset.dismiss); render(); return; }
  if (t.dataset.remove) {
    const u = S.job.used.find((x) => x.id === t.dataset.remove);
    const it = itemById(u.item);
    post(u.item, 'returned', u.qty, { job: S.job.id });
    S.job.used = S.job.used.filter((x) => x !== u);
    S.job.history.push({ at: dmy(TODAY) + ' ' + new Date().toTimeString().slice(0, 5), text: `${me().name} put back ${qtyU(u.qty, it.unit)} ${it.name}` });
    S.notice = { fresh: true, text: `Put ${qtyU(u.qty, it.unit)} of ${it.name} back in stock.` };
    render(); return;
  }
  switch (t.dataset.act) {
    case 'close-sheet': S.sheet = null; render(); break;
    case 'pick': S.sheet = { type: 'pick', item: null, q: '', values: {}, errors: {} }; render(); break;
    case 'pick-again': S.sheet = { type: 'pick', item: null, q: '', values: {}, errors: {} }; render(); break;
    case 'toggle-stop': {
      const it = itemById(r.id); it.stopped = !it.stopped; queueChange();
      S.notice = { fresh: true, text: it.stopped ? `Stopped using ${it.name}. It's under the Stopped chip, with its history, and no longer offered for jobs.` : `${it.name} is in use again.` };
      render(); break;
    }
    case 'fill-bad': S.form = { id: 'new', values: { name: 'Capacitor 45 µF (new make)', code: 'cap-45', unit: 'nos', sale: '450 rs', cost: '', hsn: '853', gst: '18', low: '', opening: '2.5' }, errors: {} }; render(); document.querySelector('[data-item-form] button[type=submit]').click(); break;
    case 'template': downloadTemplate(); break;
    case 'sample-csv': S.csvResult = null; S.csv = { ...checkCsv(SAMPLE_CSV, SAMPLE_CSV.length), file: 'coolcare-stock.csv', text: SAMPLE_CSV }; render(); break;
    case 'clear-csv': S.csv = null; S.csvResult = null; render(); break;
    case 'do-import': doImport(); break;
    case 'toggle-closed': S.job.state = S.job.state === 'CLOSED' ? 'WORK_DONE' : 'CLOSED'; S.notice = null; render(); break;
    case 'lines': S.showLines = !S.showLines; render(); break;
  }
});
app.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.matches('[data-search]')) { S.q = t.value; refreshList(); }
  if (t.matches('[data-pick-search]')) { S.sheet.q = t.value; document.querySelector('[data-pick-results]').innerHTML = pickRows(S.items.filter((i) => !i.stopped && (!t.value || matches(i, t.value))).sort((a, b) => a.name.localeCompare(b.name))); }
  if (S.sheet && S.sheet.item && t.name === 'qty') {
    const it = itemById(S.sheet.item);
    const q = parseQty(t.value, it.unit);
    if (S.sheet.type === 'count') { const d = q.ok ? r3(q.value - it.qty) : null; document.querySelector('[data-diff]').textContent = d == null ? '' : d === 0 ? 'Count matches. Nothing to change.' : `This records ${signed(d, it.unit)} as a count correction.`; }
    if (S.sheet.type === 'pick') document.querySelector('[data-short]').hidden = !(q.ok && q.value > it.qty);
  }
});
app.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.matches('[data-file]') && t.files[0]) {
    const f = t.files[0];
    f.text().then((text) => { S.csvResult = null; S.csv = { ...checkCsv(text, f.size), file: f.name, text }; render(); });
  }
  if (S.sheet && S.sheet.type === 'out' && t.name === 'reason') { S.sheet.values = Object.fromEntries(new FormData(t.form).entries()); render(); document.querySelector(`.sheet input[value="${t.value}"]`).focus(); }
});
app.addEventListener('submit', (ev) => {
  ev.preventDefault();
  if (ev.target.matches('[data-sheet-form]')) submitSheet(ev.target);
  if (ev.target.matches('[data-item-form]')) submitItem(ev.target);
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
function refreshList() {
  const res = document.querySelector('[data-results]');
  if (!res) return;
  res.innerHTML = resultsHtml();
  document.querySelector('[data-chips]').innerHTML = chipsHtml(counts());
}
function downloadTemplate() {
  const csv = CSV_COLS.join(',') + '\nCAP-35,Capacitor 35 µF,nos,380,170,8532,18,5,10\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = 'karyahub-stock-template.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Mockup bar (not part of the app) ---------- */
const SCREENS = [['#/stock', 'Stock list'], ['#/stock/new', 'Add item'], ['#/stock/item/cap25', 'Item: in, out, count'], ['#/stock/import', 'CSV import'], ['#/jobs/J-0042', 'Job: parts used']];
function paintBar() {
  if (EMBED) return;
  const btn = (group, val, label, on) => `<button type="button" data-${group}="${val}" aria-pressed="${on}">${label}</button>`;
  const hash = S.view === 'window' ? location.hash || '#/stock' : S.frameHash || '#/stock';
  document.getElementById('mockbar').innerHTML = `<div class="mock-bar" role="region" aria-label="Mockup controls, not part of the app">
    <strong>KaryaHub CR-0011 mockup</strong>
    <span class="mock-group"><span>Screen</span>${SCREENS.map(([h, l]) => btn('go', h, l, hash.startsWith(h) && (h !== '#/stock' || hash === '#/stock'))).join('')}</span>
    <span class="mock-group"><span>Signed in as</span>${btn('role', 'owner', 'Owner', S.role === 'owner')}${btn('role', 'technician', 'Technician', S.role === 'technician')}</span>
    <span class="mock-group"><span>Signal</span>${btn('signal', 'on', 'On', S.online)}${btn('signal', 'off', 'Off', !S.online)}</span>
    <span class="mock-group"><span>Theme</span>${btn('theme', 'system', 'System', S.theme === 'system')}${btn('theme', 'light', 'Light', S.theme === 'light')}${btn('theme', 'dark', 'Dark', S.theme === 'dark')}</span>
    <span class="mock-group"><span>View</span>${btn('view', 'window', 'This window', S.view === 'window')}${btn('view', 'phone', 'Phone 375', S.view === 'phone')}${btn('view', 'desktop', 'Desktop 1280', S.view === 'desktop')}${btn('view', 'both', 'Both', S.view === 'both')}</span>
  </div>`;
}
function frameSrc(hash) { return `${location.pathname}?embed=1&role=${S.role}&signal=${S.online ? 'on' : 'off'}&theme=${S.theme}${hash}`; }
function paintFrames() {
  const box = document.getElementById('frames');
  const appEl = document.getElementById('app');
  if (S.view === 'window') { box.hidden = true; box.innerHTML = ''; appEl.hidden = false; render(); return; }
  appEl.hidden = true; box.hidden = false; box.className = 'mock-frames';
  const sizes = { phone: [[375, 780, 'Phone, 375 px']], desktop: [[1280, 820, 'Desktop, 1280 px']], both: [[375, 780, 'Phone, 375 px'], [1280, 820, 'Desktop, 1280 px']] }[S.view];
  const avail = window.innerWidth - 48 - (S.view === 'both' ? 375 + 24 : 0);
  box.innerHTML = sizes.map(([w, h, label]) => {
    const scale = w > 400 ? Math.min(1, avail / w) : 1;
    return `<div class="mock-frame"><span>${label}${scale < 1 ? `, shown at ${Math.round(scale * 100)} %` : ''}</span><div class="mock-frame-box" style="width:${Math.round(w * scale)}px;height:${Math.round(h * scale)}px"><iframe title="${label}" src="${frameSrc(S.frameHash || '#/stock')}" width="${w}" height="${h}" style="transform:scale(${scale})"></iframe></div></div>`;
  }).join('');
  paintBar();
}
document.getElementById('mockbar').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.go) { S.frameHash = d.go; if (S.view === 'window') { location.hash = d.go; } else paintFrames(); return; }
  if (d.role) { S.role = d.role; S.sheet = null; S.form = null; }
  if (d.signal) { S.online = d.signal === 'on'; if (S.online) flushSoon(); }
  if (d.theme) S.theme = d.theme;
  if (d.view) { S.frameHash = S.view === 'window' ? location.hash || '#/stock' : S.frameHash; S.view = d.view; }
  if (S.view === 'window') render(); else { applyTheme(); paintFrames(); }
});
window.addEventListener('resize', () => { if (S.view !== 'window') { clearTimeout(paintFrames.t); paintFrames.t = setTimeout(paintFrames, 150); } });

if (!location.hash) history.replaceState(null, '', '#/stock');
render();
</script>
